
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
            color: #222;
        }

        h1, h2 {
            color: #183153;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #1769aa;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
        }

        .panel {
            background: white;
            padding: 20px;
            margin: 24px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        #result {
            margin-top: 20px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.7;
        }

        #status {
            color: #555;
        }

        iframe {
            max-width: 100%;
        }
    </style>
</head>

<body>
    <h1>My First Webpage</h1>

    <button onclick="alert('Hello! Your button works.')">
        Click Me
    </button>

    <section class="panel">
        <h2>Watch the video</h2>

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/eGmZZFJ-8PY"
            title="YouTube video"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write;
                   encrypted-media; gyroscope; picture-in-picture;
                   web-share"
            allowfullscreen>
        </iframe>
    </section>

    <section class="panel">
        <h2>AI Wikipedia Summarizer</h2>

        <p>
            Enter a person's name, topic, or concept.
            Our AI will summarize the matching Wikipedia article.
        </p>

        <form id="summaryForm">
            <label for="topic">Enter your topic:</label>

            <input
                type="text"
                id="topic"
                placeholder="e.g. Albert Einstein"
                maxlength="200"
                required
            >

            <button type="submit" id="submitButton">
                Summarize with AI
            </button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>

        <div id="result" aria-live="polite"></div>
    </section>

    <section class="panel">
        <h2>BMW S1000RR</h2>

        <p>
            Click below to view the BMW S1000RR image.
        </p>

        <a
            href="https://cdn.bikedekho.com/processedimages/bmw/s1000rr/640X309/s1000rr63944bddea0d4.jpg?imwidth=600&impolicy=resize"
            target="_blank"
            rel="noopener noreferrer">
            View BMW S1000RR image
        </a>
    </section>

    <script>
        const form = document.getElementById("summaryForm");
        const topicInput = document.getElementById("topic");
        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const submitButton = document.getElementById("submitButton");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const topic = topicInput.value.trim();

            if (!topic) {
                status.textContent = "Please enter a topic.";
                result.textContent = "";
                return;
            }

            submitButton.disabled = true;
            status.textContent =
                "Finding the Wikipedia article and generating your summary...";
            result.textContent = "";

            try {
                const response = await fetch("/summarize", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ topic: topic })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Something went wrong."
                    );
                }

                const heading = document.createElement("h3");
                heading.textContent = data.title;

                const source = document.createElement("p");
                source.textContent = "Source: " + data.source;

                const summary = document.createElement("p");
                summary.textContent = data.summary;

                result.replaceChildren(heading, source, summary);
                status.textContent = "Summary generated successfully.";

            } catch (error) {
                status.textContent = "Unable to generate summary.";
                result.textContent = error.message;
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
